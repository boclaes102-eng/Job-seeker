[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import order, bugbear, pyupgrade
select = ["F", "E", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters as Body(...), Query(...) defaults
extend-immutable-calls = ["fastapi.Body", "fastapi.Query", "fastapi.Depends"]
